- name: check even or odd numbers
  hosts: frontend
  tasks:
  - name: print if Redhat
    debug:
      msg: "OS familty is Redhat, pacjakge is dnf"
    when: ansible_facts.os_family == "RedHat"
  - name: print if Debian
    debug:
      msg: "OS familty is Debian, pacjakge is apt-get"
    when: ansible_facts.os_family == "Debian"
  - name: print the facts
    debug:
      msg: "OS familty is {{ ansible_facts.os_family }}"