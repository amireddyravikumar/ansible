- name: check even or odd numbers
  hosts: local
  connection: local
  vars:
    given_number: 1
  tasks:
  - name: print even number
    debug:
      msg: "Yes, even number {{ given_number }}"  
    when: given_number%2 = 0
  - name: print  odd number
    debug:
      msg: "Yes, odd number {{ given_number }}"  
    when: given_number%2 = 1
                 
